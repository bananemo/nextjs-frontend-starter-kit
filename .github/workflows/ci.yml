name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Env validation is skipped in CI; see `skipValidation` in src/lib/env.ts.
  CI: 'true'

jobs:
  # Everything that needs no browser and no build. Fast, so it fails first.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed to validate every commit in the PR range.
          fetch-depth: 0

      - uses: ./.github/actions/setup-project

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # `next typegen` runs first: PageProps/LayoutProps are generated globals
      # and do not exist until it has. `pnpm check:types` does both.
      - name: Types
        run: pnpm check:types

      - name: Lint
        run: pnpm lint

      - name: Unused code and dependencies
        run: pnpm check:deps

  # Component tests and Storybook stories are both Vitest browser-mode runs, so
  # they share one container rather than paying for two.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project

      - name: Unit and component tests
        run: pnpm test --coverage

      - name: Storybook stories
        run: pnpm storybook:test

  # Builds and then exercises the build. Keeping both in one job avoids handing
  # `.next` between jobs: a cache written on the host runner is not reliably
  # restorable inside a container, because the compression differs.
  e2e:
    name: Build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      # playwright.config.ts starts `pnpm start` against the build above.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
