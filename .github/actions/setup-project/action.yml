name: Setup project
description: Install pnpm, Node.js and the project dependencies

inputs:
  restore-nextjs-cache:
    description: Whether to restore the Next.js build output from the build job
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The container-based jobs run as a different uid than the one that owns the
    # checkout, so git refuses to operate on it ("dubious ownership"). That
    # breaks `lefthook install`, which pnpm runs via the `prepare` script.
    - name: Trust the workspace directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        # Single source of truth for the Node version, shared with local dev.
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Next.js build output
      if: inputs.restore-nextjs-cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          .next
          next-env.d.ts
        key: nextjs-build-${{ github.sha }}
        fail-on-cache-miss: true
